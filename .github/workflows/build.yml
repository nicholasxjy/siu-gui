name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin/arm64
            artifact: darwin-arm64
          - runner: macos-15-intel
            platform: darwin/amd64
            artifact: darwin-amd64
          - runner: macos-latest
            platform: darwin/universal
            artifact: darwin-universal
          - runner: windows-latest
            platform: windows/amd64
            artifact: windows-amd64
          - runner: windows-11-arm
            platform: windows/arm64
            artifact: windows-arm64
          - runner: ubuntu-22.04
            platform: linux/amd64
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Linux runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 fonts-noto-cjk libarchive-tools
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:build
      - name: Go tests with race detector
        if: matrix.platform != 'windows/arm64'
        run: go test -race ./...
      - name: Go tests on Windows ARM64
        if: matrix.platform == 'windows/arm64'
        run: go test ./...
      - run: bun run build --platform ${{ matrix.platform }}
      - run: bun scripts/release.ts --platform ${{ matrix.platform }}
      - name: Verify macOS and Linux terminal archive
        if: runner.os != 'Windows' && matrix.platform != 'darwin/universal'
        shell: bash
        run: |
          shopt -s nullglob
          archives=(release-assets/siu-tui_*.tar.gz)
          test "${#archives[@]}" -eq 1
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tar -xf "${archives[0]}" -C "$work"
          test -x "$work/siu-tui"
          test -s "$work/LICENSE"
          test -s "$work/THIRD_PARTY_LICENSES.txt"
          version=$(bun -p 'require("./package.json").version')
          reported=$("$work/siu-tui" --version)
          test "$reported" = "siu-tui $version"
      - name: Verify Windows terminal archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem release-assets -Filter 'siu-tui_*.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected one terminal ZIP' }
          $work = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'siu-tui')
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $work.FullName
          foreach ($name in @('siu-tui.exe', 'LICENSE', 'THIRD_PARTY_LICENSES.txt')) {
            $file = Get-Item -LiteralPath (Join-Path $work.FullName $name)
            if ($file -isnot [IO.FileInfo] -or $file.Length -eq 0) {
              throw "Invalid archive entry $name"
            }
          }
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $reported = & (Join-Path $work.FullName 'siu-tui.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "siu-tui.exe exited with code $LASTEXITCODE" }
          if ($reported -cne "siu-tui $version") { throw "Unexpected version: $reported" }
      - name: Real backend browser checks
        if: matrix.platform == 'linux/amd64'
        run: |
          bunx agent-browser install --with-deps
          bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siu-${{ matrix.artifact }}
          path: |
            build/**
            release-assets/**
            .artifacts/e2e/**
          if-no-files-found: warn
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: siu-*
          path: artifacts
      - name: Collect packages and checksums
        shell: bash
        run: |
          mkdir release-assets
          cp artifacts/siu-*/release-assets/* release-assets/
          version=${GITHUB_REF_NAME#v}
          for suffix in macos_arm64.dmg macos_x64.dmg macos_universal.dmg macos_universal.zip windows_x64_setup.exe windows_arm64_setup.exe linux_x64.deb linux_x64.tar.gz linux_arm64.deb linux_arm64.tar.gz; do
            test -s "release-assets/siu-project_${version}_${suffix}"
          done
          for suffix in macos_arm64.tar.gz macos_x64.tar.gz windows_x64.zip windows_arm64.zip linux_x64.tar.gz linux_arm64.tar.gz; do
            test -s "release-assets/siu-tui_${version}_${suffix}"
          done
          test "$(find release-assets -type f | wc -l)" -eq 16
          (cd release-assets && sha256sum *) > SHA256SUMS.txt
          mv SHA256SUMS.txt release-assets/
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
