<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Siu</title>
  <desc>An S-shaped connection between a resource module and an agent, on an iris-blue tile.</desc>
  <!-- Single source for the desktop icon, in-app brand and favicon.
       The transparent 100-unit margin keeps the tile inside the macOS icon grid.
       A broad silhouette and two solid terminals survive taskbar-sized rendering. -->
  <defs>
    <linearGradient id="base" x1="194" y1="134" x2="812" y2="916" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6578f2" />
      <stop offset=".48" stop-color="#4658dc" />
      <stop offset="1" stop-color="#293aab" />
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(276 166) rotate(55) scale(780 740)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a8c6ff" stop-opacity=".38" />
      <stop offset="1" stop-color="#6073ec" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ribbon" x1="454" y1="260" x2="590" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" />
      <stop offset=".5" stop-color="#f1f6ff" />
      <stop offset="1" stop-color="#cbd9ff" />
    </linearGradient>
    <linearGradient id="module" x1="610" y1="260" x2="710" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bbfff0" />
      <stop offset="1" stop-color="#69dece" />
    </linearGradient>
    <filter id="shadow" x="160" y="200" width="704" height="640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#base)" />
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#light)" />
  <rect x="102" y="102" width="820" height="820" rx="182" stroke="#fff" stroke-opacity=".2" stroke-width="3" />
  <!-- One uninterrupted route: install once, connect to agents. -->
  <path d="M662 316H460C364 316 292 358 292 422S354 528 450 528H574C670 528 732 570 732 634S660 740 564 740H362" stroke="#192878" stroke-opacity=".32" stroke-width="112" stroke-linecap="round" filter="url(#shadow)" />
  <path d="M662 300H460C364 300 292 342 292 406S354 512 450 512H574C670 512 732 554 732 618S660 724 564 724H362" stroke="url(#ribbon)" stroke-width="108" stroke-linecap="round" />
  <!-- Resource matrix / agent socket. Details are secondary to the S silhouette. -->
  <rect x="600" y="238" width="124" height="124" rx="40" fill="url(#module)" />
  <g fill="#278d9c">
    <rect x="640" y="278" width="16" height="16" rx="5" />
    <rect x="668" y="278" width="16" height="16" rx="5" />
    <rect x="640" y="306" width="16" height="16" rx="5" />
    <rect x="668" y="306" width="16" height="16" rx="5" />
  </g>
  <rect x="304" y="662" width="124" height="124" rx="40" fill="#f7fbff" />
  <circle cx="366" cy="724" r="16" fill="#5866cc" />
</svg>
